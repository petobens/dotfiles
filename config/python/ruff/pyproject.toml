[tool.ruff]
line-length = 88
# Keep Ruff's default exclusions and also skip build output
extend-exclude = ["build"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# Enable every stable rule, as in pytemplate. This config uses the system Ruff,
# so upgrades can add new diagnostics without a lockfile change
select = ["ALL"]
ignore = [
    # Shared with pytemplate
    "C90",  # Complexity score
    "COM812",  # Missing trailing comma; conflicts with the formatter
    "CPY",  # Copyright headers
    "E501",  # Line too long; the formatter handles length
    "EM",  # Exception messages assigned to variables first
    "FBT",  # Boolean positional arguments
    "PLR09",  # Too many arguments, branches, statements, and similar counts
    "PLR2004",  # Magic values in comparisons
    "Q",  # The formatter handles quotes
    "TRY003",  # Long messages passed to exception classes
    "TRY300",  # Return statements moved to an else block
    # Standalone scripts and configuration files
    "ERA001",  # Commented-out code, such as disabled config options
    "FIX002",  # TODO comments
    "INP001",  # Scripts outside a package
    "S310",  # URL schemes passed to urlopen
    "S603",  # subprocess calls without a shell
    "S607",  # Commands found on PATH, such as git
    "SLF001",  # Private members, often patched by config files
    "T20",  # print and pprint
    "TD",  # TODO comment format
]

# Automatically fix import order; leave other lint fixes for review
fixable = ["I"]

[tool.ruff.lint.per-file-ignores]
# Notebooks may import modules after setup cells
"*.ipynb" = ["E402"]
# Tests describe behavior through their names and use asserts
"test_*.py" = ["D100", "D101", "D102", "D103", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
