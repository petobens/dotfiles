[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "B",  # Bugbear plugin
    "D",  # pydocstyle plugin
    "I",  # import sorting
    "ARG",  # Unused arguments
    "DTZ",  # Timezone-aware datetimes
    "FURB",  # Refurb suggestions
    "PLC",  # Pylint conventions
    "PLE",  # Pylint errors
    "PLW",  # Pylint warnings
    "UP",  # Python upgrades
    "SIM",  # Simplifications
    "RUF",  # Ruff-specific rules
    "PT",  # pytest conventions
    "C4",  # Comprehensions
    "PERF",  # Performance
    "PTH",  # pathlib
    "RET",  # Return statements
    "TC",  # Type-checking imports
]

ignore = [
    "E203",  # Whitespace before ':'
    "E501",  # Line too long
    "D107",  # Missing docstring in init
    "D203",  # Same as D211 about class docstring
    "D213",  # Same as D212 about summary docstring
    "D413",  # Missing blank line after last section
    "D416",  # Section name should end with a colon
]

# Automatically fix import order; leave other lint fixes for review
fixable = ["I"]

# Exclude a variety of commonly ignored directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint.per-file-ignores]
# Notebooks may import modules after setup cells
"*.ipynb" = ["E402"]
# Tests describe behavior through their names and assertions
"test_*.py" = ["D100", "D101", "D102", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
