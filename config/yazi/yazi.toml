[mgr]
linemode = "none"
ratio = [1, 3, 4]
scrolloff = 5
show_hidden = false
show_symlink = true
sort_by = "natural"
sort_dir_first = true
sort_sensitive = false

[preview]
max_height = 1800
max_width = 1200
tab_size = 4
wrap = "no"

[tasks]
suppress_preload = true

[opener]
edit = [{ block = true, for = "unix", run = '${EDITOR:-nvim} %s' }]
# Route GUI openers through Hyprland so newly opened windows receive focus
open = [{ for = "unix", orphan = true, run = '~/.config/hypr/scripts/open_file xdg-open %s1' }]
play = [{ for = "unix", orphan = true, run = '~/.config/hypr/scripts/open_file mpv --force-window %s' }]

[open]
prepend_rules = [
    { mime = "application/json", use = "edit" },
    { mime = "application/pdf", use = "open" },
    { mime = "image/*", use = "open" },
    # The exact HTML rule must precede the text wildcard because the first match wins
    { mime = "text/html", use = "open" },
    { mime = "text/*", use = "edit" },
    { mime = "video/*", use = "play" },
]

[[plugin.prepend_fetchers]]
group = "git"
run = "git"
url = "*"

[[plugin.prepend_fetchers]]
group = "git"
run = "git"
url = "*/"
