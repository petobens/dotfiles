# Leader mappings
[[mgr.prepend_keymap]]
on = [","]
run = "plugin leader"
desc = "Leader mappings"

# Navigation
[[mgr.prepend_keymap]]
on = ["<Enter>"]
run = "plugin smart-enter"
desc = "Enter directory or open file"

[[mgr.prepend_keymap]]
on = ["u"]
run = "leave"
desc = "Parent directory"

[[mgr.prepend_keymap]]
on = ["h"]
run = "leave"
desc = "Parent directory"

[[mgr.prepend_keymap]]
on = ["H"]
run = "cd ~"
desc = "Home"

# File operations
[[mgr.prepend_keymap]]
on = ["D"]
run = "create --dir"
desc = "Create directory"

[[mgr.prepend_keymap]]
on = ["F"]
run = "create"
desc = "Create file"

[[mgr.prepend_keymap]]
on = ["c"]
run = "yank"
desc = "Copy selected files"

[[mgr.prepend_keymap]]
on = ["m"]
run = "yank --cut"
desc = "Cut selected files"

[[mgr.prepend_keymap]]
on = ["p"]
run = ["paste", "unyank"]
desc = "Paste and clear yanked files"

[[mgr.prepend_keymap]]
on = ["d"]
run = "remove"
desc = "Trash selected files"

[[mgr.prepend_keymap]]
on = ["y"]
run = "copy name_without_ext"
desc = "Copy filename without extension"

[[mgr.prepend_keymap]]
on = ["r"]
run = "rename --cursor=before_ext"
desc = "Rename selected files"

[[mgr.prepend_keymap]]
on = ["o"]
run = "open"
desc = "Open selected files"

# Tabs
[[mgr.prepend_keymap]]
on = ["<C-p>"]
run = "tab_switch -1 --relative"
desc = "Previous tab"

[[mgr.prepend_keymap]]
on = ["<C-n>"]
run = "tab_switch 1 --relative"
desc = "Next tab"

[[mgr.prepend_keymap]]
on = ["<C-c>"]
run = "close"
desc = "Close tab"

# Bookmarks
[[mgr.prepend_keymap]]
on = ['"']
run = "plugin bookmarks -- jump"
desc = "Open bookmark"

# Disabled defaults
[[mgr.prepend_keymap]]
on = ["z"]
run = "noop"

# FZF navigation
[[mgr.prepend_keymap]]
on = ["<C-t>"]
run = "plugin fzf-nav -- files"
desc = "Find file"

[[mgr.prepend_keymap]]
on = ["<A-t>"]
run = "plugin fzf-nav -- files --no-ignore"
desc = "Find file, including ignored files"

[[mgr.prepend_keymap]]
on = ["<A-c>"]
run = "plugin fzf-nav -- dirs"
desc = "Find directory"

[[mgr.prepend_keymap]]
on = ["<A-d>"]
run = "plugin fzf-nav -- dirs --no-ignore"
desc = "Find directory, including ignored directories"

[[mgr.prepend_keymap]]
on = ["<A-z>"]
run = "plugin zoxide"
desc = "Jump with zoxide"

[[mgr.prepend_keymap]]
on = ["<A-p>"]
run = "plugin fzf-nav -- parents"
desc = "Select parent directory"
