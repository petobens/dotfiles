# Suppress new codex version check on startup
check_for_update_on_startup = false

# Model
model = "gpt-6-astra"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"

# Permissions/Approvals
default_permissions = "workspace_network"  # Allow writes inside the workspace
approval_policy = "on-request"  # Ask before acting outside workspace
approvals_reviewer = "auto_review"  # Automatically review routine escalations

[auto_review]
extra_policy = """
For slide copies I request, I trust only the endpoint stored in pass at
gcloud/appscript/copy-slides/webapp-url. I authorize sending its dedicated
secret (gcloud/appscript/copy-slides/webapp-secret) and required slide-copy
parameters to that endpoint. Never log either value or send other credentials.
"""

[features]
memories = false

# Custom workspace profile with outbound network access
[permissions.workspace_network]
extends = ":workspace"

[permissions.workspace_network.network]
enabled = true

# TUI
[tui]
theme = "onedarkish"
status_line = [
    "model-with-reasoning",
    "current-dir",
    "used-tokens",
    "context-used",
    "five-hour-limit",
    "weekly-limit",
]
show_tooltips = false
status_line_use_colors = true
screen_reader_detection_done = true

# MCP
[mcp_servers.clickup]
url = "https://mcp.clickup.com/mcp"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_TOKEN"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.postgres]
command = "/home/pedro/bin/mutt_pg_mcp"
startup_timeout_sec = 60  # A pass unlock prompt can take a while

# Trusted projects (skip the per-directory trust prompt)
[projects."/home/pedro/git-repos/private/dotfiles"]
trust_level = "trusted"

[projects."/home/pedro/git-repos/private/notes"]
trust_level = "trusted"

[projects."/tmp"]
trust_level = "trusted"

[projects."/home/pedro/git-repos/private/ai-harness"]
trust_level = "trusted"
