# Define the left-to-right segment order and Powerline styling
# Rendering order comes from this format; settings below are grouped by role
format = """
$character\
$username\
$hostname\
[ ](bg:white)\
${custom.context_start}\
$aws\
${custom.aws_to_python}\
${custom.aws_to_context}\
${custom.aws_to_path}\
${custom.python_start_plain}\
$python\
${custom.python_to_context}\
${custom.python_to_path}\
${custom.git_remote}\
$git_branch\
$git_status\
${custom.context_end}\
${custom.plain_end}\
${custom.directory_parent}\
${custom.directory_current}\
${custom.prompt_flags}\
${custom.error_after_flags}\
${custom.error}\
${custom.end_after_flags}\
${custom.end} """
add_newline = false
palette = "onedark"

[palettes.onedark]
background = "#24272e"
blue = "#61afef"
cursor_grey = "#282c34"
green = "#98c379"
foreground = "#abb2bf"
mono = "#828997"
orange = "#d19a66"
purple = "#c678dd"
red = "#e06c75"
special_grey = "#3b4048"
white = "#d0d0d0"

# Input mode and session identity
[character]
format = "$symbol"
success_symbol = "[ I ](bold fg:background bg:blue)[](fg:blue bg:white)"
error_symbol = "[ I ](bold fg:background bg:blue)[](fg:blue bg:white)"
vimcmd_symbol = "[ N ](bold fg:background bg:green)[](fg:green bg:white)"
vimcmd_replace_one_symbol = "[ R ](bold fg:background bg:purple)[](fg:purple bg:white)"
vimcmd_replace_symbol = "[ R ](bold fg:background bg:purple)[](fg:purple bg:white)"
vimcmd_visual_symbol = "[ V ](bold fg:background bg:blue)[](fg:blue bg:white)"

[username]
show_always = true
format = "[ $user]($style)"
style_user = "bold fg:background bg:white"
style_root = "bold red bg:white"

[hostname]
ssh_only = true
ssh_symbol = "󰌘 "
format = "[ $ssh_symbol@$hostname]($style)"
style = "bold fg:background bg:white"

# Built-in environment and repository context
[aws]
format = "[](fg:white bg:orange)[  $profile ](bold fg:background bg:orange)"

[python]
format = "[  $virtualenv ](bold fg:background bg:purple)"
detect_extensions = []
detect_files = []
detect_folders = []

[git_branch]
symbol = ""
format = "[$branch ](fg:foreground bg:special_grey)"

# Show only modified files and upstream branch differences
[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "red bg:special_grey"
conflicted = ""
deleted = ""
modified = "${count} "
renamed = ""
staged = ""
stashed = ""
typechanged = ""
untracked = ""
ahead = "${count} "
behind = "${count} "
diverged = "${ahead_count} ${behind_count} "

# Custom context band and transitions
[custom.context_start]
command = "printf ''"
shell = ["sh"]
when = '''test -z "$AWS_PROFILE" && test -z "$VIRTUAL_ENV"'''
require_repo = true
format = "[$output](fg:white bg:special_grey)"

# AWS uses distinct joins for each possible following segment
[custom.aws_to_python]
command = "printf ''"
shell = ["sh"]
when = '''test -n "$AWS_PROFILE" && test -n "$VIRTUAL_ENV"'''
format = "[$output](fg:orange bg:purple)"

[custom.aws_to_context]
command = "printf ''"
shell = ["sh"]
when = '''test -n "$AWS_PROFILE" && test -z "$VIRTUAL_ENV"'''
require_repo = true
format = "[$output](fg:orange bg:special_grey)"

[custom.aws_to_path]
command = "printf ''"
shell = ["sh"]
when = '''
test -n "$AWS_PROFILE" && test -z "$VIRTUAL_ENV" &&
    ! git rev-parse --is-inside-work-tree >/dev/null 2>&1
'''
format = "[$output](fg:orange bg:cursor_grey)"

# Python uses distinct joins for each possible neighboring segment
[custom.python_start_plain]
command = "printf ''"
shell = ["sh"]
when = '''test -n "$VIRTUAL_ENV" && test -z "$AWS_PROFILE"'''
format = "[$output](fg:white bg:purple)"

[custom.python_to_context]
command = "printf ''"
shell = ["sh"]
when = '''test -n "$VIRTUAL_ENV"'''
require_repo = true
format = "[$output](fg:purple bg:special_grey)"

[custom.python_to_path]
command = "printf ''"
shell = ["sh"]
when = '''
test -n "$VIRTUAL_ENV" &&
    ! git rev-parse --is-inside-work-tree >/dev/null 2>&1
'''
format = "[$output](fg:purple bg:cursor_grey)"

[custom.git_remote]
command = '''
remote=$(git ls-remote --get-url 2>/dev/null)
case "$remote" in
    *github*) printf '' ;;
    *bitbucket*) printf '' ;;
    *gitlab*) printf '' ;;
    *) printf '' ;;
esac
'''
shell = ["sh"]
when = true
require_repo = true
unsafe_no_escape = true
format = "[ $output ](fg:foreground bg:special_grey)"

[custom.context_end]
command = "printf ''"
shell = ["sh"]
when = true
require_repo = true
format = "[$output](fg:special_grey bg:cursor_grey)"

[custom.plain_end]
command = "printf ''"
shell = ["sh"]
when = '''
test -z "${AWS_PROFILE}${VIRTUAL_ENV}" &&
    ! git rev-parse --is-inside-work-tree >/dev/null 2>&1
'''
format = "[$output](fg:white bg:cursor_grey)"

# Compose path and command state with separate modules for the correct
# transitions across every combination of flags and exit status
[custom.directory_parent]
command = "starship_prompt_segment parent"
shell = ["sh"]
when = true
format = "[ $output](fg:mono bg:cursor_grey)"

[custom.directory_current]
command = "starship_prompt_segment current"
shell = ["sh"]
when = true
format = "[ $output ](bold fg:mono bg:cursor_grey)"

[custom.prompt_flags]
command = "starship_prompt_segment flags"
shell = ["sh"]
when = true
format = "([](fg:cursor_grey bg:orange)[ $output ](bold fg:background bg:orange))"

[custom.error_after_flags]
command = "starship_prompt_segment error-after-flags"
shell = ["sh"]
when = true
format = "([](fg:orange bg:red)[  $output ](bold fg:background bg:red)[](fg:red))"

[custom.error]
command = "starship_prompt_segment error"
shell = ["sh"]
when = true
format = "([](fg:cursor_grey bg:red)[  $output ](bold fg:background bg:red)[](fg:red))"

[custom.end_after_flags]
command = "starship_prompt_segment end-after-flags"
shell = ["sh"]
when = true
format = "[$output](fg:orange)"

[custom.end]
command = "starship_prompt_segment end"
shell = ["sh"]
when = true
format = "[$output](fg:cursor_grey)"
