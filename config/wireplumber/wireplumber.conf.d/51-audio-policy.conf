# Headphones are Bluetooth; keep the laptop speakers available alongside HDMI
device.profile.priority.rules = [
    {
        matches = [ { device.name = "alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic" } ]
        actions = { update-props = {
            priorities = [ "HiFi (HDMI1, HDMI2, HDMI3, Mic1, Mic2, Speaker)" ]
        } }
    }
]

# Automatic output preference: Bluetooth, laptop speakers, then other outputs
monitor.alsa.rules = [
    {
        matches = [ { node.name = "~alsa_output.*HiFi__Speaker__sink" } ]
        actions = { update-props = { priority.session = 1200 } }
    }
    # USB microphone inputs take precedence over the laptop's digital mic
    {
        matches = [ { node.name = "~alsa_input.usb-.*" } ]
        actions = { update-props = { priority.session = 2400 } }
    }
    {
        matches = [ { node.name = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic1__source" } ]
        actions = { update-props = { priority.session = 2200 } }
    }
]

monitor.bluez.rules = [
    {
        matches = [ { node.name = "~bluez_output.*" } ]
        actions = { update-props = { priority.session = 1400 } }
    }
]
