# Lock before sleep, blank displays, and suspend on idle
general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/lock_screen
    on_lock_cmd = ~/.config/hypr/scripts/lock_media lock; makoctl mode -a do-not-disturb
    on_unlock_cmd = ~/.config/hypr/scripts/lock_media unlock; makoctl mode -r do-not-disturb
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Lock after 10 minutes of inactivity
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Turn displays off after 15 minutes; activity wakes them to the lock screen
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspend after 30 minutes only while on battery; docked and AC sessions keep running
listener {
    timeout = 1800
    on-timeout = grep -qsx Discharging /sys/class/power_supply/BAT*/status && systemctl suspend
}
