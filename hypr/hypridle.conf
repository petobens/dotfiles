# Lock before sleep, blank displays, and suspend on idle
general {
    lock_cmd = pidof hyprlock || hyprlock
    on_lock_cmd = ~/.config/hypr/scripts/lock_media lock; makoctl mode -a do-not-disturb
    on_unlock_cmd = ~/.config/hypr/scripts/lock_media unlock; makoctl mode -r do-not-disturb
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspend only while on battery, so docked and AC sessions keep running
listener {
    timeout = 1800
    on-timeout = grep -qsx Discharging /sys/class/power_supply/BAT*/status && systemctl suspend
}
