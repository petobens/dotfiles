general {
    hide_cursor = true
}

auth {
    fingerprint:enabled = true
}

background {
    monitor =
    color = rgb(24272e)
}

input-field {
    monitor =
    size = 200, 200
    outline_thickness = 3
    rounding = -1
    inner_color = rgb(24272e)
    outer_color = rgb(24272e)
    font_color = rgb(abb2bf)
    check_color = rgb(528bff)
    check_text = <span></span> # Clear password dots without widening the ring
    fail_color = rgb(e06c75)
    fail_text =
    placeholder_text =
    dots_size = 0.07
    dots_spacing = 0.15
    dots_center = true
    position = 0, -42
    halign = center
    valign = center
}

# Hyprlock widens fields to fit status text. Use a narrow transparent field so
# the ring stays circular and the message can sit below the password dots.
input-field {
    monitor =
    size = 1, 72
    outline_thickness = 0
    inner_color = rgba(24272e00)
    check_color = rgba(24272e00)
    check_text = <span foreground="##528bff">Validating</span>
    fail_color = rgba(24272e00)
    fail_text = <span foreground="##e06c75">Wrong!</span>
    placeholder_text =
    hide_input = true
    hide_input_base_color = rgba(24272e00)
    fade_on_empty = false
    position = 0, -68
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = rgb(abb2bf)
    font_size = 28
    position = 0, 22
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %b %d"
    color = rgb(abb2bf)
    font_size = 12
    position = 0, -10
    halign = center
    valign = center
}
