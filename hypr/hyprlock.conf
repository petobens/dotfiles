# General
general {
    hide_cursor = true
    fractional_scaling = 1
}

# Authentication
auth {
    fingerprint:enabled = true
}

# Background
background {
    monitor =
    color = rgb(24272e)
}

# Authentication ring
# Separate fields keep the ring fixed while positioning its content
# independently.
input-field {
    monitor =
    size = 200, 200
    outline_thickness = 3
    rounding = -1
    inner_color = rgb(24272e)
    outer_color = rgb(24272e)
    check_color = rgb(528bff)
    check_text =
    fail_color = rgb(e06c75)
    fail_text =
    placeholder_text =
    hide_input = true
    hide_input_base_color = rgba(24272e00)
    fade_on_empty = false
    position = 0, 0
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = rgb(abb2bf)
    font_size = 28
    position = 0, 45
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%a %b %d"
    color = rgb(abb2bf)
    font_size = 12
    position = 0, 9
    halign = center
    valign = center
}

# Password dots
input-field {
    monitor =
    size = 200, 200
    outline_thickness = 0
    inner_color = rgba(24272e00)
    outer_color = rgba(24272e00)
    font_color = rgb(abb2bf)
    check_color = rgba(24272e00)
    check_text =
    fail_color = rgba(24272e00)
    fail_text =
    placeholder_text =
    dots_size = 0.07
    dots_spacing = 0.15
    dots_center = true
    position = 0, -16
    halign = center
    valign = center
    zindex = 1
}

# Authentication status
# Hyprlock widens fields to fit status text, so use a narrow transparent field.
input-field {
    monitor =
    size = 1, 72
    outline_thickness = 0
    inner_color = rgba(24272e00)
    check_color = rgba(24272e00)
    check_text = <span foreground="##528bff">Validating</span>
    fail_color = rgba(24272e00)
    fail_text = <span foreground="##e06c75">Wrong!</span>
    placeholder_text =
    hide_input = true
    hide_input_base_color = rgba(24272e00)
    fade_on_empty = false
    position = 0, -45
    halign = center
    valign = center
    zindex = 1
}
