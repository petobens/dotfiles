general {
    hide_cursor = true
}

auth {
    fingerprint:enabled = true
}

background {
    monitor =
    color = rgb(24272e)
}

input-field {
    monitor =
    size = 200, 200
    outline_thickness = 3
    rounding = -1
    inner_color = rgb(24272e)
    outer_color = rgb(24272e)
    font_color = rgb(abb2bf)
    check_color = rgb(528bff)
    check_text = <span></span> # Clear password dots without widening the ring
    fail_color = rgb(e06c75)
    fail_text =
    placeholder_text =
    dots_size = 0.15
    dots_spacing = 0.15
    dots_center = true
    position = 0, 0
    halign = center
    valign = center
}

# Hyprlock widens an input field to fit its status text, so render the text in a
# separate transparent field to keep the authentication ring circular.
input-field {
    monitor =
    size = 1, 112
    outline_thickness = 0
    inner_color = rgba(24272e00)
    check_color = rgba(24272e00)
    check_text = <span foreground="##528bff">Validating</span>
    fail_color = rgba(24272e00)
    fail_text = <span foreground="##e06c75">Wrong!</span>
    placeholder_text =
    hide_input = true
    fade_on_empty = false
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = rgb(abb2bf)
    font_size = 32
    position = 0, 35
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %b %d"
    color = rgb(abb2bf)
    font_size = 16
    position = 0, -35
    halign = center
    valign = center
}
